<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="FB Revision concept — homepage">
  <rect width="720" height="470" fill="#F4F3F7"/>

  <!-- concept banner -->
  <rect x="0" y="0" width="720" height="22" fill="#0C1120"/>
  <text x="360" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#9D9AB4">
    <tspan fill="#AB8449" font-weight="bold">Designkoncept</tspan> — ett förslag på hur fbrevision.se skulle kunna se ut 2026
  </text>

  <!-- header -->
  <rect x="0" y="22" width="720" height="44" fill="#F4F3F7"/>
  <rect x="0" y="65" width="720" height="1" fill="#D8D5E0"/>
  <rect x="30" y="32" width="24" height="24" rx="1.5" fill="none" stroke="#AB8449" stroke-width="1.2"/>
  <path d="M36 51V37h6.4M36 44.5h5" fill="none" stroke="#AB8449" stroke-width="1.7"/>
  <path d="M46 51V37h3a2.6 2.6 0 0 1 0 5.2h-3h3.4a2.8 2.8 0 0 1 0 5.6H46z" fill="none" stroke="#AB8449" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="62" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#131A2E">FB Revision</text>
  <text x="62" y="53" font-family="Helvetica, Arial, sans-serif" font-size="6.2" letter-spacing="1.3" fill="#4A4860">UPPSALA SEDAN 1975</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#131A2E" opacity="0.78">
    <text x="404" y="47">Tjänster</text>
    <text x="450" y="47">Om oss</text>
    <text x="492" y="47">Medarbetare</text>
    <text x="556" y="47">Kontakt</text>
  </g>
  <rect x="606" y="33" width="86" height="22" rx="1.5" fill="#AB8449"/>
  <text x="649" y="47.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#14100A">Boka ett samtal</text>

  <!-- dark hero -->
  <rect x="0" y="66" width="720" height="344" fill="#0C1120"/>

  <!-- the founding year, outlined -->
  <text x="596" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5.5" fill="#B8945A" opacity="0.9">SEDAN</text>
  <text x="596" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="none" stroke="#AB8449" stroke-opacity="0.32" stroke-width="1.5">1975</text>

  <text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="2.4" fill="#AB8449">REVISIONSBYRÅ I UPPSALA</text>
  <rect x="212" y="104.5" width="40" height="1" fill="#AB8449" opacity="0.45"/>

  <text x="38" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#E8E6F0">Över femtio år som</text>
  <text x="38" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#AB8449">bollplank<tspan fill="#E8E6F0"> åt Upplands</tspan></text>
  <text x="38" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#E8E6F0">företagare.</text>

  <text x="40" y="252" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9D9AB4">Revision, redovisning, skattefrågor och ekonomisk rådgivning — från en byrå</text>
  <text x="40" y="266" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9D9AB4">som funnits längre än de flesta av sina klienter.</text>

  <rect x="40" y="284" width="168" height="30" rx="1.5" fill="#AB8449"/>
  <text x="124" y="303" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#14100A">Boka ett kostnadsfritt samtal</text>
  <rect x="216" y="284" width="104" height="30" rx="1.5" fill="none" stroke="#E8E6F0" stroke-opacity="0.32"/>
  <text x="268" y="303" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#E8E6F0">Se våra tjänster</text>

  <!-- hero rule: the credentials, on the first screen -->
  <rect x="40" y="348" width="640" height="1" fill="#E8E6F0" opacity="0.16"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#9D9AB4">
    <rect x="40" y="372" width="4" height="4" fill="#AB8449"/><text x="52" y="378">Ansluten till SRF konsulterna</text>
    <rect x="196" y="372" width="4" height="4" fill="#AB8449"/><text x="208" y="378">3 auktoriserade revisorer</text>
    <rect x="336" y="372" width="4" height="4" fill="#AB8449"/><text x="348" y="378">3 auktoriserade redovisningskonsulter</text>
    <rect x="546" y="372" width="4" height="4" fill="#AB8449"/><text x="558" y="378">14 medarbetare</text>
  </g>

  <!-- first light section -->
  <text x="40" y="440" font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="1.6" fill="#5A5870">BYRÅN I SIFFROR</text>
  <text x="188" y="444" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#131A2E">En liten byrå med stora meriter</text>
</svg>
