<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 360" role="img" aria-label="FB Revision concept on a phone">
  <rect width="180" height="360" fill="#F4F3F7"/>

  <!-- banner -->
  <rect x="0" y="0" width="180" height="26" fill="#0C1120"/>
  <text x="90" y="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#AB8449" font-weight="bold">DESIGNKONCEPT</text>
  <text x="90" y="21" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="4.6" fill="#9D9AB4">inte FB Revisions officiella webbplats</text>

  <!-- header -->
  <rect x="10" y="34" width="16" height="16" rx="1" fill="none" stroke="#AB8449" stroke-width="1"/>
  <text x="31" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" font-weight="bold" fill="#131A2E">FB Revision</text>
  <text x="31" y="49" font-family="Helvetica, Arial, sans-serif" font-size="4.4" letter-spacing="0.9" fill="#4A4860">UPPSALA SEDAN 1975</text>
  <rect x="150" y="36" width="18" height="1.4" rx="0.7" fill="#131A2E"/>
  <rect x="150" y="41" width="18" height="1.4" rx="0.7" fill="#131A2E"/>
  <rect x="150" y="46" width="18" height="1.4" rx="0.7" fill="#131A2E"/>
  <rect x="0" y="58" width="180" height="1" fill="#D8D5E0"/>

  <!-- dark hero -->
  <rect x="0" y="59" width="180" height="228" fill="#0C1120"/>
  <text x="14" y="84" font-family="Helvetica, Arial, sans-serif" font-size="5" letter-spacing="1.4" fill="#AB8449">REVISIONSBYRÅ I UPPSALA</text>
  <text x="13" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#E8E6F0">Över femtio</text>
  <text x="13" y="133" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#E8E6F0">år som</text>
  <text x="13" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#AB8449">bollplank.</text>
  <text x="14" y="176" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#9D9AB4">Revision, redovisning och rådgivning</text>
  <text x="14" y="186" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#9D9AB4">för Upplands företagare.</text>
  <rect x="14" y="200" width="152" height="26" rx="1.5" fill="#AB8449"/>
  <text x="90" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14100A">Boka ett kostnadsfritt samtal</text>
  <rect x="14" y="232" width="152" height="26" rx="1.5" fill="none" stroke="#E8E6F0" stroke-opacity="0.32"/>
  <text x="90" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#E8E6F0">Se våra tjänster</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="5.4" fill="#9D9AB4">
    <rect x="14" y="268" width="3" height="3" fill="#AB8449"/><text x="22" y="272">3 auktoriserade revisorer</text>
  </g>

  <!-- ledger -->
  <text x="14" y="306" font-family="Helvetica, Arial, sans-serif" font-size="5" letter-spacing="1.1" fill="#5A5870">BYRÅN I SIFFROR</text>
  <rect x="14" y="314" width="152" height="1" fill="#D8D5E0"/>
  <text x="14" y="330" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#5A5870">Medarbetare</text>
  <text x="166" y="331" text-anchor="end" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#131A2E">14</text>
  <rect x="14" y="338" width="152" height="1" fill="#D8D5E0"/>
  <text x="14" y="352" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#5A5870">Verksamma sedan</text>
  <text x="166" y="353" text-anchor="end" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#131A2E">1975</text>
</svg>
