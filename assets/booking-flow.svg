<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Booking flow: browse, pick a time, confirmed">
  <rect width="640" height="360" fill="#f3eae1"/>

  <!-- ===== Phone 1: browse ===== -->
  <g>
    <rect x="20" y="20" width="160" height="288" rx="26" fill="#1c1916"/>
    <rect x="28" y="28" width="144" height="272" rx="20" fill="#faf6f1"/>
    <text x="44" y="58" font-family="Georgia, serif" font-size="15" fill="#2a2521">Services</text>
    <rect x="44" y="74" width="112" height="36" rx="9" fill="#f3eae1"/>
    <rect x="54" y="86" width="56" height="6" rx="3" fill="#cab9ac"/>
    <text x="140" y="97" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c16a4b">650 kr</text>
    <rect x="44" y="120" width="112" height="36" rx="9" fill="#f3eae1"/>
    <rect x="54" y="132" width="68" height="6" rx="3" fill="#cab9ac"/>
    <text x="140" y="143" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c16a4b">850 kr</text>
    <rect x="44" y="166" width="112" height="36" rx="9" fill="#f3eae1"/>
    <rect x="54" y="178" width="48" height="6" rx="3" fill="#cab9ac"/>
    <text x="140" y="189" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c16a4b">500 kr</text>
    <rect x="44" y="250" width="112" height="34" rx="17" fill="#2a2521"/>
    <text x="100" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#faf6f1">Book</text>
  </g>

  <!-- arrow -->
  <g fill="none" stroke="#c16a4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 164 h32"/>
    <path d="M221 157 l8 7 -8 7"/>
  </g>

  <!-- ===== Phone 2: pick a time ===== -->
  <g>
    <rect x="240" y="20" width="160" height="288" rx="26" fill="#1c1916"/>
    <rect x="248" y="28" width="144" height="272" rx="20" fill="#faf6f1"/>
    <text x="264" y="58" font-family="Georgia, serif" font-size="15" fill="#2a2521">Pick a time</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6e645b">
      <rect x="264" y="74" width="32" height="28" rx="7" fill="#f3eae1"/><text x="280" y="92" text-anchor="middle">09:00</text>
      <rect x="304" y="74" width="32" height="28" rx="7" fill="#f3eae1"/><text x="320" y="92" text-anchor="middle">10:30</text>
      <rect x="344" y="74" width="32" height="28" rx="7" fill="#c16a4b"/><text x="360" y="92" text-anchor="middle" fill="#faf6f1">12:00</text>
      <rect x="264" y="110" width="32" height="28" rx="7" fill="#f3eae1"/><text x="280" y="128" text-anchor="middle">14:00</text>
      <rect x="304" y="110" width="32" height="28" rx="7" fill="#f3eae1"/><text x="320" y="128" text-anchor="middle">16:00</text>
      <rect x="344" y="110" width="32" height="28" rx="7" fill="#f3eae1"/><text x="360" y="128" text-anchor="middle">17:30</text>
    </g>
    <rect x="264" y="250" width="112" height="34" rx="17" fill="#2a2521"/>
    <text x="320" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#faf6f1">Confirm</text>
  </g>

  <!-- arrow -->
  <g fill="none" stroke="#c16a4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M416 164 h32"/>
    <path d="M441 157 l8 7 -8 7"/>
  </g>

  <!-- ===== Phone 3: confirmed ===== -->
  <g>
    <rect x="460" y="20" width="160" height="288" rx="26" fill="#1c1916"/>
    <rect x="468" y="28" width="144" height="272" rx="20" fill="#faf6f1"/>
    <circle cx="540" cy="120" r="34" fill="#7e9a78"/>
    <path d="M526 120 l10 10 18 -20" fill="none" stroke="#faf6f1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2a2521">Booked!</text>
    <rect x="496" y="198" width="88" height="6" rx="3" fill="#cab9ac"/>
    <rect x="512" y="212" width="56" height="6" rx="3" fill="#cab9ac"/>
  </g>

  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6e645b" text-anchor="middle">
    <text x="100" y="334">Browse</text>
    <text x="320" y="334">Pick a time</text>
    <text x="540" y="334">Booked</text>
  </g>
</svg>
