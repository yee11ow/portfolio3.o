<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Nordström Advokater concept — law firm website">
  <rect width="720" height="470" fill="#f7f6f3"/>

  <!-- nav -->
  <text x="32" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="1.6" fill="#18191b">NORDSTRÖM ADVOKATER</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5e6062">
    <text x="512" y="30">Rättsområden</text>
    <text x="592" y="30">Medarbetare</text>
    <text x="668" y="30">Kontakt</text>
  </g>

  <!-- dark hero -->
  <rect x="0" y="46" width="720" height="196" fill="#18191b"/>
  <text x="48" y="94" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.4" fill="#c2a06a">ADVOKATBYRÅ · STOCKHOLM</text>
  <text x="46" y="142" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f7f6f3">Juridisk rådgivning</text>
  <text x="46" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f7f6f3">när det gäller.</text>
  <rect x="510" y="150" width="162" height="36" rx="18" fill="#f7f6f3"/>
  <text x="591" y="173" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#18191b">Kontakta oss</text>

  <!-- practice areas: front and centre, one line each -->
  <text x="32" y="270" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.2" fill="#8a6a35">RÄTTSOMRÅDEN</text>
  <g>
    <rect x="32" y="282" width="320" height="62" rx="8" fill="#ffffff" stroke="#dcd9d2"/>
    <text x="52" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#18191b">Affärsjuridik</text>
    <rect x="52" y="318" width="252" height="6" rx="3" fill="#d8d4cc"/>
  </g>
  <g>
    <rect x="368" y="282" width="320" height="62" rx="8" fill="#ffffff" stroke="#dcd9d2"/>
    <text x="388" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#18191b">Arbetsrätt</text>
    <rect x="388" y="318" width="216" height="6" rx="3" fill="#d8d4cc"/>
  </g>
  <g>
    <rect x="32" y="354" width="320" height="62" rx="8" fill="#ffffff" stroke="#dcd9d2"/>
    <text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#18191b">Fastighetsrätt</text>
    <rect x="52" y="390" width="230" height="6" rx="3" fill="#d8d4cc"/>
  </g>
  <g>
    <rect x="368" y="354" width="320" height="62" rx="8" fill="#ffffff" stroke="#dcd9d2"/>
    <text x="388" y="378" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#18191b">Tvistelösning</text>
    <rect x="388" y="390" width="264" height="6" rx="3" fill="#d8d4cc"/>
  </g>

  <!-- the people, because legal work is bought from people -->
  <g>
    <circle cx="46" cy="444" r="13" fill="#cfcbc3"/>
    <circle cx="72" cy="444" r="13" fill="#c4bfb6"/>
    <circle cx="98" cy="444" r="13" fill="#b9b4aa"/>
    <text x="124" y="448" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5e6062">Möt våra advokater</text>
  </g>
</svg>
