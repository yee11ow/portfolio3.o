<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Pilates Flow — current site before redesign: cluttered corporate layout, booking buried">
  <rect width="560" height="380" fill="#eceef1"/>

  <!-- busy header, too many items -->
  <rect width="560" height="40" fill="#ffffff"/>
  <rect x="20" y="14" width="70" height="12" rx="2" fill="#4a6fa5"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8a9098">
    <text x="250" y="25">Home</text>
    <text x="300" y="25">About Us</text>
    <text x="360" y="25">Services</text>
    <text x="420" y="25">Pricing</text>
    <text x="475" y="25">Team</text>
    <text x="515" y="25">News</text>
  </g>

  <!-- generic stock hero, no CTA -->
  <rect x="0" y="40" width="560" height="150" fill="#cfd4da"/>
  <rect x="0" y="40" width="560" height="150" fill="#b9c0c8" opacity="0.4"/>
  <text x="280" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5b636d" letter-spacing="1">WELCOME TO OUR STUDIO</text>
  <text x="280" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6f7780">Your partner in health, wellbeing and corporate balance since 2011</text>

  <!-- wall of text -->
  <g fill="#c2c8ce">
    <rect x="20" y="210" width="250" height="7" rx="3"/>
    <rect x="20" y="224" width="250" height="7" rx="3"/>
    <rect x="20" y="238" width="250" height="7" rx="3"/>
    <rect x="20" y="252" width="220" height="7" rx="3"/>
    <rect x="20" y="266" width="250" height="7" rx="3"/>
    <rect x="20" y="280" width="190" height="7" rx="3"/>
    <rect x="290" y="210" width="250" height="7" rx="3"/>
    <rect x="290" y="224" width="250" height="7" rx="3"/>
    <rect x="290" y="238" width="230" height="7" rx="3"/>
    <rect x="290" y="252" width="250" height="7" rx="3"/>
    <rect x="290" y="266" width="200" height="7" rx="3"/>
    <rect x="290" y="280" width="240" height="7" rx="3"/>
  </g>

  <!-- tiny, hard-to-find booking link -->
  <text x="20" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9aa0a6" text-decoration="underline">› book a session here</text>
</svg>
