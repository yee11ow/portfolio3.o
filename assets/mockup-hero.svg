<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 690" role="img" aria-label="Concept of a booking-ready beauty and wellness studio website">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7b79e"/>
      <stop offset="0.55" stop-color="#d68f6c"/>
      <stop offset="1" stop-color="#c16a4b"/>
    </linearGradient>
  </defs>

  <rect width="320" height="690" fill="#faf6f1"/>

  <!-- status bar -->
  <text x="22" y="34" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2a2521">9:41</text>
  <rect x="266" y="24" width="16" height="10" rx="2" fill="#2a2521"/>
  <rect x="286" y="24" width="14" height="10" rx="2" fill="#2a2521"/>

  <!-- header -->
  <text x="22" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="2" fill="#2a2521">LUMÉ</text>
  <g fill="#2a2521">
    <rect x="276" y="60" width="22" height="2.4" rx="1.2"/>
    <rect x="276" y="68" width="22" height="2.4" rx="1.2"/>
  </g>

  <!-- hero image -->
  <rect x="22" y="92" width="276" height="236" rx="20" fill="url(#warm)"/>
  <circle cx="232" cy="156" r="34" fill="#f3d9c8" opacity="0.55"/>
  <rect x="44" y="280" width="150" height="9" rx="4.5" fill="#faf2ec" opacity="0.85"/>
  <rect x="44" y="296" width="96" height="9" rx="4.5" fill="#faf2ec" opacity="0.6"/>

  <!-- overline -->
  <text x="22" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.5" fill="#c16a4b">PILATES · STOCKHOLM</text>

  <!-- headline -->
  <text x="20" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2a2521">Move with</text>
  <text x="20" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2a2521">intention.</text>

  <!-- primary booking button -->
  <rect x="22" y="480" width="164" height="46" rx="23" fill="#2a2521"/>
  <text x="104" y="509" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#faf6f1">Book a class</text>

  <!-- service chips -->
  <text x="22" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e645b">Reformer · Mat · Private</text>

  <!-- two cards -->
  <rect x="22" y="578" width="131" height="92" rx="14" fill="#f3eae1"/>
  <rect x="34" y="590" width="107" height="48" rx="9" fill="#e7b79e"/>
  <rect x="34" y="646" width="74" height="7" rx="3.5" fill="#cab9ac"/>

  <rect x="167" y="578" width="131" height="92" rx="14" fill="#f3eae1"/>
  <rect x="179" y="590" width="107" height="48" rx="9" fill="#cdb6a4"/>
  <rect x="179" y="646" width="60" height="7" rx="3.5" fill="#cab9ac"/>
</svg>
