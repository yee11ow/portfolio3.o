<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Pilates Flow — concept redesign after: booking on the first screen, calm and editorial">
  <defs>
    <linearGradient id="pw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7b79e"/>
      <stop offset="1" stop-color="#c16a4b"/>
    </linearGradient>
  </defs>
  <rect width="560" height="380" fill="#faf6f1"/>

  <!-- clean header with visible Book button -->
  <text x="28" y="40" font-family="Georgia, serif" font-size="20" letter-spacing="2" fill="#2a2521">FLOW</text>
  <rect x="448" y="22" width="84" height="30" rx="15" fill="#2a2521"/>
  <text x="490" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#faf6f1">Book a class</text>

  <!-- hero: text left, image right -->
  <text x="28" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#c16a4b">PILATES · STOCKHOLM</text>
  <text x="26" y="162" font-family="Georgia, serif" font-size="40" fill="#2a2521">Move with</text>
  <text x="26" y="204" font-family="Georgia, serif" font-size="40" fill="#2a2521">intention.</text>
  <rect x="28" y="230" width="150" height="44" rx="22" fill="#c16a4b"/>
  <text x="103" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#faf6f1">Book a class →</text>

  <rect x="330" y="80" width="202" height="200" rx="18" fill="url(#pw)"/>
  <circle cx="470" cy="135" r="26" fill="#f3d9c8" opacity="0.5"/>

  <!-- schedule chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6e645b">
    <rect x="28" y="312" width="96" height="32" rx="9" fill="#f3eae1"/><text x="76" y="332" text-anchor="middle">Mon · 09:00</text>
    <rect x="134" y="312" width="96" height="32" rx="9" fill="#f3eae1"/><text x="182" y="332" text-anchor="middle">Wed · 18:00</text>
    <rect x="240" y="312" width="96" height="32" rx="9" fill="#f3eae1"/><text x="288" y="332" text-anchor="middle">Fri · 07:30</text>
  </g>
</svg>
