<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="FB Revision concept — audit and accounting firm website">
  <rect width="720" height="470" fill="#f7f6f3"/>

  <!-- nav -->
