name: Site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_site.py
      - run: node --check public/script.js
      - run: node --test tests/middleware.test.mjs
      - name: Ensure generated cases are current
        run: |
          python scripts/build_cases.py
          git diff --exit-code -- public
