name: Site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_site.py
      - run: node --check public/script.js
      - run: node --test tests/middleware.test.mjs
      - name: Ensure generated cases are current
        run: |
          python scripts/build_cases.py
          git diff --exit-code -- public
  responsive:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Check phones, foldable layouts and tablets
        run: node tests/responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: responsive-results/
          retention-days: 14
